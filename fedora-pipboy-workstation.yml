---
- name: Set up Fedora workstation
  hosts: workstation
  become: true

  vars_files:
    - packages.yml

  vars:
    setup_user: "{{ lookup('env', 'USER') }}"
    setup_home: "{{ lookup('env', 'HOME') }}"
    oh_my_zsh_dir: "{{ setup_home }}/.oh-my-zsh"
    powerlevel10k_dir: "{{ oh_my_zsh_dir }}/custom/themes/powerlevel10k"
    vim_vundle_dir: "{{ setup_home }}/.vim/bundle/Vundle.vim"
    dnf_install_packages: "{{ packages.common + packages.fedora + (packages.docker if install_docker else []) }}"

  pre_tasks:
    - name: Ensure this is Fedora
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Fedora"
        fail_msg: "This playbook is intended for Fedora."

  tasks:
    - name: Add the Docker CE repository
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when: install_docker

    # Refresh metadata and upgrade once, before anything is installed. The
    # install step below reuses this metadata and only installs missing packages.
    - name: Update and upgrade Fedora packages
      ansible.builtin.command:
        argv:
          - dnf
          - -y
          - "--setopt=*.skip_if_unavailable=True"
          - upgrade
          - --refresh

    - name: Find DNF packages that are not installed
      ansible.builtin.command:
        argv: "{{ ['rpm', '-q', '--whatprovides'] + dnf_install_packages }}"
      register: dnf_installed_query
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install missing DNF packages
      ansible.builtin.command:
        argv: "{{ ['dnf', '-y', '--setopt=*.skip_if_unavailable=True', 'install'] + dnf_missing_packages }}"
      vars:
        dnf_missing_packages: >-
          {{ dnf_installed_query.stdout_lines
             | select('match', '^no package provides ')
             | map('regex_replace', '^no package provides ', '')
             | list }}
      when: dnf_missing_packages | length > 0

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
      when: install_docker

    - name: Ensure the Docker group exists
      ansible.builtin.group:
        name: docker
        state: present
      when: install_docker

    - name: Allow the workstation user to run Docker
      ansible.builtin.user:
        name: "{{ setup_user }}"
        groups: docker
        append: true
      when: install_docker

    - name: Enable Firewalld
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Check Syncthing web UI Firewalld rule
      ansible.builtin.command: firewall-cmd --permanent --query-port=8384/tcp
      register: syncthing_firewalld_rule
      changed_when: false
      failed_when: syncthing_firewalld_rule.rc not in [0, 1]

    - name: Allow Syncthing web UI through Firewalld
      ansible.builtin.command: firewall-cmd --permanent --add-port=8384/tcp
      changed_when: true
      when: syncthing_firewalld_rule.rc == 1
      notify: Reload Firewalld

    - name: Install Flatpak when apps are configured
      ansible.builtin.command:
        argv:
          - dnf
          - -y
          - "--setopt=*.skip_if_unavailable=True"
          - install
          - flatpak
      when:
        - flatpak_packages | length > 0
        - "'flatpak' not in dnf_install_packages"

    - name: Add Flathub remote when apps are configured
      ansible.builtin.command:
        cmd: flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      changed_when: false
      when: flatpak_packages | length > 0

    - name: Install Flatpak apps
      ansible.builtin.command:
        cmd: "flatpak install -y flathub {{ item }}"
      loop: "{{ flatpak_packages }}"
      changed_when: false
      when: flatpak_packages | length > 0

    - name: Update Flatpak apps
      ansible.builtin.command: flatpak update -y
      changed_when: false
      failed_when: false
      when: update_flatpak

    - name: Create Oh My Zsh directory parent
      become: false
      ansible.builtin.file:
        path: "{{ oh_my_zsh_dir | dirname }}"
        state: directory
        mode: "0755"
      when: install_oh_my_zsh

    - name: Install Oh My Zsh
      become: false
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ oh_my_zsh_dir }}"
        depth: 1
        update: true
      when: install_oh_my_zsh

    - name: Create Oh My Zsh custom theme directory
      become: false
      ansible.builtin.file:
        path: "{{ oh_my_zsh_dir }}/custom/themes"
        state: directory
        mode: "0755"
      when: install_powerlevel10k

    - name: Install Powerlevel10k
      become: false
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ powerlevel10k_dir }}"
        depth: 1
        update: true
      when: install_powerlevel10k

    - name: Create user font directory
      become: false
      ansible.builtin.file:
        path: "{{ setup_home }}/.local/share/fonts"
        state: directory
        mode: "0755"
      when: copy_fonts

    - name: Install fonts
      become: false
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}"
        argv:
          - find
          - setup/fonts
          - -maxdepth
          - "1"
          - -type
          - f
          - "("
          - -iname
          - "*.ttf"
          - -o
          - -iname
          - "*.otf"
          - -o
          - -iname
          - "*.ttc"
          - -o
          - -iname
          - "*.otc"
          - ")"
          - -exec
          - install
          - -m
          - "0644"
          - -t
          - "{{ setup_home }}/.local/share/fonts"
          - "{}"
          - "+"
      changed_when: false
      when: copy_fonts

    - name: Refresh font cache
      become: false
      ansible.builtin.command: fc-cache -fv
      changed_when: false
      when: copy_fonts

    - name: Copy config files
      become: false
      ansible.builtin.shell:
        chdir: "{{ playbook_dir }}"
        cmd: |
          set -euo pipefail
          src="setup/configs/{{ item.src }}"
          dest="{{ setup_home }}/{{ item.dest }}"

          if [ ! -f "$src" ]; then
            echo "missing source: $src" >&2
            exit 1
          fi

          mkdir -p "$(dirname "$dest")"

          if [ -e "$dest" ] && cmp -s "$src" "$dest"; then
            echo "unchanged"
            exit 0
          fi

          if [ -e "$dest" ]; then
            cp -p "$dest" "$dest.ansible-backup-$(date +%Y%m%d%H%M%S)"
          fi

          install -m 0644 "$src" "$dest"
          echo "installed"
        executable: /bin/bash
      loop: "{{ config_files }}"
      changed_when: "'installed' in config_install.stdout"
      register: config_install
      when: copy_shell_configs

    - name: Copy AI configs
      become: false
      ansible.builtin.shell:
        chdir: "{{ playbook_dir }}"
        cmd: |
          set -euo pipefail
          src_root="setup/ai"
          dest_root="{{ setup_home }}/{{ ai_config_dir }}"
          declare -A tool_dirs=(
          {% for name, dir in ai_tool_dirs.items() %}
            [{{ name | quote }}]={{ (setup_home ~ '/' ~ dir) | quote }}
          {% endfor %}
          )

          while IFS= read -r -d '' src; do
            rel="${src#"$src_root"/}"
            top="${rel%%/*}"
            if [ "$top" != "$rel" ] && [ -n "${tool_dirs[$top]+set}" ]; then
              dest="${tool_dirs[$top]}/${rel#*/}"
            else
              dest="$dest_root/$rel"
            fi
            mode=0644
            case "$rel" in
              bin/* | */bin/* | hooks/* | */hooks/*) mode=0755 ;;
            esac

            mkdir -p "$(dirname "$dest")"

            if [ -e "$dest" ] && cmp -s "$src" "$dest"; then
              continue
            fi

            if [ -e "$dest" ]; then
              cp -p "$dest" "$dest.ansible-backup-$(date +%Y%m%d%H%M%S)"
            fi

            install -m "$mode" "$src" "$dest"
            echo "installed $dest"
          done < <(find "$src_root" -type f -print0)
        executable: /bin/bash
      changed_when: "'installed' in ai_config_install.stdout"
      register: ai_config_install
      when: copy_ai_configs

    - name: Create shared AI directories
      become: false
      ansible.builtin.file:
        path: "{{ setup_home }}/{{ ai_config_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ ai_shared_dirs }}"
      when: link_ai_configs

    - name: Link AI tool configs to ~/.ai
      become: false
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          target="{{ setup_home }}/{{ ai_config_dir }}/{{ item.src }}"
          link="{{ setup_home }}/{{ item.dest }}"

          if [ ! -e "$target" ]; then
            echo "missing target: $target" >&2
            exit 1
          fi

          if [ -L "$link" ] && [ "$(readlink "$link")" = "$target" ]; then
            echo "unchanged"
            exit 0
          fi

          mkdir -p "$(dirname "$link")"

          if [ -e "$link" ] || [ -L "$link" ]; then
            mv "$link" "$link.ansible-backup-$(date +%Y%m%d%H%M%S)"
          fi

          ln -s "$target" "$link"
          echo "installed"
        executable: /bin/bash
      loop: "{{ ai_tool_links }}"
      changed_when: "'installed' in ai_link_install.stdout"
      register: ai_link_install
      when: link_ai_configs

    - name: Install tmux plugin manager
      become: false
      ansible.builtin.git:
        repo: https://github.com/tmux-plugins/tpm.git
        dest: "{{ setup_home }}/.tmux/plugins/tpm"
        depth: 1
        update: true
      environment:
        GIT_TERMINAL_PROMPT: "0"
      when: install_tmux_plugins

    - name: Install plugins declared in tmux.conf
      become: false
      ansible.builtin.command:
        argv:
          - "{{ setup_home }}/.tmux/plugins/tpm/bin/install_plugins"
      environment:
        HOME: "{{ setup_home }}"
        GIT_TERMINAL_PROMPT: "0"
      register: tmux_plugin_install
      changed_when: "'download success' in tmux_plugin_install.stdout"
      when: install_tmux_plugins

    - name: Create Vim bundle directory
      become: false
      ansible.builtin.file:
        path: "{{ vim_vundle_dir | dirname }}"
        state: directory
        mode: "0755"
      when: install_vim_plugins

    - name: Install Vundle for Vim
      become: false
      ansible.builtin.git:
        repo: https://github.com/VundleVim/Vundle.vim.git
        dest: "{{ vim_vundle_dir }}"
        depth: 1
        update: true
      when: install_vim_plugins

    # Silent Ex mode (-E -s) never waits for "Press ENTER", which full-screen
    # vim does under Ansible when vimrc errors before plugins exist (e.g. a
    # missing colorscheme). Errors there make vim exit 1, so only fail on
    # other codes; 124 means the timeout hit.
    - name: Install plugins declared in vimrc
      become: false
      ansible.builtin.command:
        argv:
          - timeout
          - "600"
          - vim
          - -E
          - -s
          - -u
          - "{{ setup_home }}/.vimrc"
          - +PluginInstall
          - +qall
        stdin: ""
      environment:
        HOME: "{{ setup_home }}"
        GIT_TERMINAL_PROMPT: "0"
      register: vim_plugin_install
      changed_when: false
      failed_when: vim_plugin_install.rc not in [0, 1]
      when: install_vim_plugins

    - name: Set zsh as default shell
      ansible.builtin.user:
        name: "{{ setup_user }}"
        shell: /usr/bin/zsh
      when: set_zsh_as_default_shell

    - name: Set global Git editor
      become: false
      ansible.builtin.command: git config --global core.editor vim
      changed_when: false
      when: configure_git

    - name: Autoremove unused DNF packages
      ansible.builtin.dnf:
        autoremove: true
      when: package_autoremove

    - name: Clean DNF cache
      ansible.builtin.command: dnf clean all
      changed_when: false
      when: package_clean

  handlers:
    - name: Reload Firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
