---
packages:
  common:
    - btop
    - clamav
    - cowsay
    - curl
    - fastfetch
    - fd-find
    - flatpak
    - fortune-mod
    - fzf
    - git
    - gnome-tweaks
    - htop
    - lolcat
    - python3
    - python3-pip
    - python3-virtualenv
    - ripgrep
    - rsync
    - syncthing
    - tmux
    - tree
    - vim
    - wget
    - zsh
  fedora:
    - clamav-update
    - firewalld
    - gnome-extensions-app
  ubuntu:
    - clamav-freshclam
    - gnome-shell-extension-manager
    - python3-venv
    - ufw
  docker_fedora:
    - docker-compose
    - moby-engine
  docker_ubuntu:
    - docker-compose-v2
    - docker.io

flatpak_packages:
  - md.obsidian.Obsidian

copy_fonts: true
copy_shell_configs: true
install_tmux_plugins: true
install_vim_plugins: true
set_vim_as_default_editor: true
install_docker: true
config_files:
  - src: zshrc
    dest: .zshrc
  - src: p10k.zsh
    dest: .p10k.zsh
  - src: bash_profile
    dest: .bash_profile
  - src: tmux.conf
    dest: .tmux.conf
  - src: vimrc
    dest: .vimrc
copy_ai_configs: true
# setup/ai/ is copied into the user home. A top-level folder named in
# ai_tool_dirs goes to that tool's directory (setup/ai/claude/ -> ~/.claude/);
# everything else goes to ~/.ai/. Files under bin/ or hooks/ are made executable.
ai_config_dir: .ai
ai_tool_dirs:
  claude: .claude
# Shared folders created in ~/.ai/ so tool links always have a target.
ai_shared_dirs:
  - agents
  - skills
  - hooks
link_ai_configs: true
# Symlinks from a tool's home into ~/.ai/. src is relative to ~/.ai/, dest to
# the user home. An existing file or folder at dest is moved to a backup first.
ai_tool_links:
  - src: AGENTS.md
    dest: .claude/CLAUDE.md
  - src: agents
    dest: .claude/agents
  - src: skills
    dest: .claude/skills
  - src: hooks
    dest: .claude/hooks
install_oh_my_zsh: true
install_powerlevel10k: true
set_zsh_as_default_shell: true
configure_git: true
update_flatpak: true
package_autoremove: true
package_clean: true
